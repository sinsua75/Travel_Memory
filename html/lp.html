<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Memory</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>

<body>

    <header class="header">

        <div class="header-inner">

            <a href="./index.html" class="logo">
                <span class="logo-icon">◉</span>
                <span>Travel Memory</span>
            </a>

            <nav class="nav">

                <a href="./index.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>홈</span>
                </a>

                <a href="./list.html" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>목록</span>
                </a>

                <a href="./favorites.html" class="nav-item">
                    <span class="nav-icon">♡</span>
                    <span>즐겨찾기</span>
                </a>

                <a href="./lp.html" class="nav-item active">
                    <span class="nav-icon">◔</span>
                    <span>LP</span>
                </a>

            </nav>

        </div>

    </header>


    <main class="player-page">

        <section class="player-area">

            <div class="player-top">

                <a href="#" class="back-btn">
                    ← 목록으로
                </a>

                <span class="playing">
                    지금 재생 중
                </span>

                <button class="player-favorite">
                    ♥
                </button>

            </div>


            <div class="player-content">

                <article class="player-card">

                    <div class="player-image">

                        <img src="./images/tokyo.jpg" alt="일본 도쿄">

                    </div>

                    <div class="player-info">

                        <div>
                            <strong>JP 일본 · 도쿄</strong>
                        </div>

                        <div class="rating">
                            ★★★★★
                        </div>

                        <p>
                            벚꽃길을 걸으면서 듣고 싶은 노래
                        </p>

                    </div>

                </article>


                <section class="music-player">

                    <div class="record">

                        <div class="record-center">
                            <span>JP</span>
                            <span>도쿄</span>
                        </div>

                    </div>


                    <div class="song-info">

                        <h2>Lemon</h2>
                        <p>Kenshi Yonezu</p>

                    </div>


                    <div class="progress-area">

                        <span>0:42</span>

                        <input type="range" min="0" max="100" value="17">

                        <span>4:16</span>

                    </div>


                    <div class="player-controls">

                        <button class="music-favorite">
                            ♥
                        </button>

                        <button class="play-button">
                            ❚❚
                        </button>

                        <button class="next-button">
                            ✓
                        </button>

                    </div>

                </section>

            </div>


            <section class="travel-memo">

                <span>▣ 여행 메모</span>

                <p>
                    벚꽃길을 걸으면서 듣고 싶은 노래
                </p>

            </section>

        </section>

    </main>


<script src = "../config.js"></script>
<script src = "../js/api/image.js"></script>
</body>

</html>
