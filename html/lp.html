<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Memory</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>

<body>

    <header class="header">

        <div class="header-inner">

            <a href="./index.html" class="logo">
                <span class="logo-icon">◉</span>
                <span>Travel Memory</span>
            </a>

            <nav class="nav">

                <a href="./index.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>홈</span>
                </a>

                <a href="./list.html" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>목록</span>
                </a>

                <a href="./favorites.html" class="nav-item">
                    <span class="nav-icon">♡</span>
                    <span>즐겨찾기</span>
                </a>

                <a href="./lp.html" class="nav-item active">
                    <span class="nav-icon">◔</span>
                    <span>LP</span>
                </a>

            </nav>

        </div>

    </header>


    <main class="player-page">
        <section class="player-area">

            <div class="player-top">
                <a href="./list.html" class="back-btn">← 목록으로</a>
                <span class="playing" id="playStatus">음악 준비 중</span>
            </div>

            <div class="player-content">

                <article class="player-card">
                    <div class="player-image">
                        <img id="travelImage" src="" alt="여행 이미지">
                    </div>

                    <div class="player-info">
                        <strong id="travelLocation"></strong>
                        <div class="rating" id="travelRating"></div>
                        <p id="travelMemo"></p>
                    </div>
                </article>

                <section class="music-player">

                    <div class="record" id="recordDisc">
                        <div class="record-center">
                            <span id="recordCountry">LP</span>
                            <span id="recordCity">PLAYER</span>
                        </div>
                    </div>

                    <div class="song-info">
                        <h2 id="songTitle">곡 제목</h2>
                        <p id="songArtist">아티스트</p>
                        <p id="musicMessage"></p>
                    </div>

                    <div class="progress-area">
                        <span id="currentTime">0:00</span>
                        <input type="range" id="progress" min="0" max="100" value="0">
                        <span id="duration">0:00</span>
                    </div>

                    <div class="player-controls">
                        <button class="play-button" id="playButton" type="button" disabled>▶</button>

                        <button class="next-button" id="restartButton" type="button">↺</button>
                    </div>

                    <audio id="audioPlayer" preload="metadata"></audio>

                    <a id="openMusicLink" href="#" target="_blank" hidden>
                        음악 서비스에서 열기 ↗
                    </a>

                </section>

            </div>

            <section class="travel-memo">
                <span>▣ 여행 메모</span>
                <p id="memoText"></p>
            </section>

        </section>
    </main>


    <script src="../config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/api/music.js"></script>
</body>

</html>
