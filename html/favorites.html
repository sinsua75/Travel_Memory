<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Memory</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>

<body>

    <header class="header">

        <div class="header-inner">

            <a href="./index.html" class="logo">
                <span class="logo-icon">◉</span>
                <span>Travel Memory</span>
            </a>

            <nav class="nav">

                <a href="./index.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>홈</span>
                </a>

                <a href="./list.html" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>목록</span>
                </a>

                <a href="./favorites.html" class="nav-item active">
                    <span class="nav-icon">♡</span>
                    <span>즐겨찾기</span>
                </a>

                <a href="./lp.html" class="nav-item">
                    <span class="nav-icon">◔</span>
                    <span>LP</span>
                </a>

            </nav>

        </div>

    </header>


    <main class="favorite-page">

        <section class="page-title">

            <div>
                <h1>즐겨찾기 <span>♥</span></h1>
                <p id = "favoriteCount">하트를 눌러둔 2개의 여행만 모아봤어요</p>
            </div>

        </section>


        <section class="travel-list favorite-list" id = "favoriteList">

            <article class="travel-item">

                <div class="travel-image">

                    <img src="./images/tokyo.jpg" alt="일본 도쿄">

                    <span class="visit-badge">
                        ✓ 방문 완료
                    </span>

                    <button class="favorite-btn active">
                        ♥
                    </button>

                    <div class="image-info">
                        <span>JP 일본</span>
                    </div>

                </div>


                <div class="travel-info">

                    <div class="travel-name">

                        <h2>도쿄</h2>

                        <div class="rating">
                            ★★★★★
                        </div>

                    </div>

                    <p class="music">
                        ♫ Lemon · Kenshi Yonezu
                    </p>

                    <p class="memo">
                        벚꽃길을 걸으면서 듣고 싶은 노래
                    </p>

                    <div class="travel-bottom">

                        <span class="date">
                            2026.03.14
                        </span>

                        <div class="item-buttons">
                            <button>✎</button>
                            <button>♧</button>
                        </div>

                    </div>

                </div>

            </article>


            <article class="travel-item">

                <div class="travel-image">

                    <img src="./images/london.jpg" alt="영국 런던">

                    <span class="visit-badge">
                        ✓ 방문 완료
                    </span>

                    <button class="favorite-btn active">
                        ♥
                    </button>

                    <div class="image-info">
                        <span>GB 영국</span>
                    </div>

                </div>


                <div class="travel-info">

                    <div class="travel-name">

                        <h2>런던</h2>

                        <div class="rating">
                            ★★★★★
                        </div>

                    </div>

                    <p class="music">
                        ♫ Yellow · Coldplay
                    </p>

                    <p class="memo">
                        비 오는 센트럴 런던의 붉은 공중전화
                    </p>

                    <div class="travel-bottom">

                        <span class="date">
                            2025.12.08
                        </span>

                        <div class="item-buttons">
                            <button>✎</button>
                            <button>♧</button>
                        </div>

                    </div>

                </div>

            </article>

        </section>

    </main>


    <script src="../config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/filter.js"></script>
    <script src="../js/favorites.js"></script>
    
</body>

</html>
