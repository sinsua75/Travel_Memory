<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Memory</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

    <script src="../js/api/countries.js" defer></script>
    <script src="../config.js" defer></script>
    <script src="../js/storage.js" defer></script>
    <script src = "../js/filter.js" defer></script>
    <script src="../js/crud.js" defer></script>
    
    

    <header class="header">

        <div class="header-inner">

            <a href="./index.html" class="logo">
                <span class="logo-icon">◉</span>
                <span>Travel Memory</span>
            </a>

            <nav class="nav">

                <a href="./index.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>홈</span>
                </a>

                <a href="./list.html" class="nav-item active">
                    <span class="nav-icon">▣</span>
                    <span>목록</span>
                </a>

                <a href="./favorites.html" class="nav-item">
                    <span class="nav-icon">♡</span>
                    <span>즐겨찾기</span>
                </a>

                <a href="./lp.html" class="nav-item">
                    <span class="nav-icon">◔</span>
                    <span>LP</span>
                </a>

            </nav>

        </div>

    </header>


    <main class="list-page">

        <section class="page-title">

            <div>
                <h1>여행 목록</h1>
                <p>총 5개의 여행 기록 중 5개를 보여드려요</p>
            </div>

            <button class="add-btn" id="addTravelBtn">
                + 여행 추가
            </button>

        </section>


        <section class="filter-area">

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="도시, 국가, 노래로 검색">
            </div>

            <div class="filter">

                <select id="sortSelect">
                    <option value="newest">최신순</option>
                    <option value="oldest">오래된순</option>
                    <option value="rating">별점순</option>
                    <option value="date">예정일순</option>
                </select>

                <div class="status-filter">
                    <button class="active" data-status="all">전체</button>
                    <button data-status="visited">방문 완료</button>
                    <button data-status="pending">예정</button>
                    <button data-status="favorite">즐겨찾기</button>
                </div>

            </div>

        </section>


        <section class="travel-list" id="travelList">

            <article class="travel-item">

            </article>

        </section>

    </main>

    <div class="detail-bg" id="detailModal">

        <div class="detail-modal">

            <div class="detail-image" id = "detailImage">

                <button class="detail-close" id="detailClose">
                    ×
                </button>

                <button class="detail-favorite" id="detailFavorite">
                    ♡
                </button>

                <div class="detail-title">

                    <h2 id="detailCountry">
                        일본 · 도쿄
                    </h2>

                    <span id="detailDate">
                        2026.03.14
                    </span>

                </div>

            </div>


            <div class="detail-body">

                <div class="detail-top">

                    <div class="detail-rating" id="detailRating">
                        ★★★★★
                    </div>

                    <span class="detail-visited" id="detailVisited">
                        ✓ 방문 완료
                    </span>

                </div>


                <div class="detail-music">

                    <div class="music-icon">
                        ♫
                    </div>

                    <div>

                        <strong id="detailSong">
                            Lemon
                        </strong>

                        <span id="detailArtist">
                            Kenshi Yonezu
                        </span>

                    </div>

                </div>


                <div class="detail-memo">

                    <span>
                        ▣ 여행 메모
                    </span>

                    <p id="detailMemo">
                        벚꽃길을 걸으면서 듣고 싶은 노래
                    </p>

                </div>

                <div class="detail-review" id="detailReview">

                    <strong>✎ 여행 후기</strong>

                    <textarea id="reviewMemo" maxlength="500" placeholder="여행에서 느낀 점을 기록하세요"></textarea>

                    <div class="review-rating" id="reviewRating">
                        <button type="button" data-rating="1">★</button>
                        <button type="button" data-rating="2">★</button>
                        <button type="button" data-rating="3">★</button>
                        <button type="button" data-rating="4">★</button>
                        <button type="button" data-rating="5">★</button>
                    </div>

                    <button id="saveReview">후기 저장</button>

                </div>

                <div class="detail-buttons">

                    <button class="lp-button">
                        ◉ LP 재생
                    </button>

                    <button class="edit-button">
                        ✎ 수정
                    </button>

                    <button class="delete-button" id="deleteTravel">
                        ▣ 삭제
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="modal-bg" id="travelModal">

        <div class="travel-modal">

            <div class="modal-header">

                <div>
                    <h2>여행 버킷리스트 추가</h2>
                    <p>새 여행을 음반처럼 기록해요</p>
                </div>

                <button class="modal-close" id="closeModal">
                    ×
                </button>

            </div>


            <div class="modal-body">

                <div class="modal-image" id = "modalImage">
                    <span id="modalImageText">🌍　국가를 입력하세요</span>
                </div>


                <label>
                    국가 검색
                </label>

                <input type="text" id="country" placeholder="예) 일본, 프랑스, 이탈리아...">


                <div class="input-row">

                    <div>
                        <label>도시</label>

                        <input type="text" id="city" placeholder="예) 도쿄">
                    </div>


                    <div>
                        <label>예정일</label>

                        <input type="date" id="date">
                    </div>

                </div>


                <div class="input-row">

                    <div>
                        
                        <label>노래 검색</label>

                        <div class = "song-input-wrap">
                            <input type="text" id="song" placeholder="곡 제목" autocomplete="off">
                            <button type = "button" id = "songSearchBtn"> ⌕ </button>

                        </div>
                        
                    </div>


                    <div>
                        <label>아티스트</label>

                        <input type="text" id="artist" placeholder="아티스트명">
                    </div>

                </div>

                <div id = "songResults" class = "songResults"></div>


                <label>
                    메모
                </label>

                <textarea id="memo" maxlength="500" placeholder="이 여행에서 듣고 싶은 순간을 적어보세요"></textarea>


                <div class="rating-area">

                    <label>별점</label>

                    <div class="rating-input" id="ratingInput">

                        <button type="button" data-rating="1">★</button>
                        <button type="button" data-rating="2">★</button>
                        <button type="button" data-rating="3">★</button>
                        <button type="button" data-rating="4">★</button>
                        <button type="button" data-rating="5">★</button>

                    </div>

                </div>


                <div class="visit-area">

                    <span>방문 완료</span>

                    <label class="switch">

                        <input type="checkbox" id="visited">

                        <span class="slider"></span>

                    </label>

                </div>


                <button class="modal-submit" id="submitTravel">
                    ◉　버킷리스트에 추가
                </button>

            </div>

        </div>

    </div>
</body>

</html>
